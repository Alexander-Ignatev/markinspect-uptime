# GitHub отключает расписания в репозитории, где 60 дней нет активности.
# Раз в месяц коммитим отметку — иначе uptime-чек молча перестанет запускаться.
name: keepalive

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Отметка активности
        run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: $(date -u +%F)" || exit 0
          git push
