# Внешний uptime-чек MarkInspect: проверяет https://markinspect.aignatev.ru/health
# каждые 5 минут с раннеров GitHub (не с сервера приложения). Три неудачи подряд
# открывают issue — GitHub присылает письмо владельцу репозитория.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Адрес проверки"
        required: false
        default: "https://markinspect.aignatev.ru/health"

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверить /health
        id: health
        env:
          URL: ${{ inputs.url || 'https://markinspect.aignatev.ru/health' }}
        run: |
          set -u
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 15 "$URL" || true)
            echo "попытка $attempt: ${body:-<нет ответа>}"
            if printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"Healthy"'; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Открыть инцидент
        if: failure()
        uses: actions/github-script@v7
        env:
          URL: ${{ inputs.url || 'https://markinspect.aignatev.ru/health' }}
        with:
          script: |
            const title = 'MarkInspect: /health не отвечает';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            const open = issues.find(i => i.title === title && !i.pull_request);
            if (open) {
              core.info(`Инцидент уже открыт: #${open.number}`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `@${context.repo.owner} проверка \`${process.env.URL}\` не прошла три попытки подряд.`,
                '',
                `Время: ${new Date().toISOString()}`,
                `Прогон: ${runUrl}`,
                '',
                'Проверить с ПК: `curl -i https://markinspect.aignatev.ru/health`, затем контейнеры на сервере (`docker compose ps`, `docker logs markinspect-api-1`).'
              ].join('\n')
            });

      - name: Закрыть инцидент
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'MarkInspect: /health не отвечает';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            for (const issue of issues.filter(i => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Проверка снова проходит (${new Date().toISOString()}).`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed'
              });
            }
